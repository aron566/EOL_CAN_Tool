name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:   # 手动触发(仅构建调试,不建 release)
    inputs:
      version:
        description: '手动构建版本号(如 1.4.6)'
        required: false
        default: '0.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "解析版本: v$V"

      - name: 校验版本一致性(仅 tag 触发)
        if: github.event_name == 'push'
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          RC_VER=$(grep -oP 'VER_PRODUCTVERSION_STR\s+"\K[0-9.]+' resource/EOL_CAN_Tool.rc)
          JSON_VER=$(grep -oP '"latest-version":\s*"\K[0-9.]+' packge_release/updates.json | head -1)
          if [ "$RC_VER" != "$V" ]; then
            echo "::error::tag v$V 与 resource/EOL_CAN_Tool.rc 版本 $RC_VER 不一致,请先改 .rc 再打 tag"
            exit 1
          fi
          if [ "$JSON_VER" != "$V" ]; then
            echo "::error::tag v$V 与 packge_release/updates.json latest-version $JSON_VER 不一致,请先改 updates.json 再打 tag"
            exit 1
          fi
          echo "版本 v$V 与 .rc / updates.json 一致,校验通过"

      - name: 安装 Qt 6.8.3 MSVC 2022 64-bit
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtcharts qtserialbus qtserialport qtmultimedia qt5compat'
          cache: true

      - name: 安装 NSIS
        shell: bash
        run: choco install nsis -y --no-progress

      - name: 安装 markdown(生成使用说明 PDF)
        shell: bash
        run: pip install markdown

      - name: 构建(qmake + nmake)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          qmake EOL_CAN_Tool.pro -spec win32-msvc "CONFIG+=release"
          nmake -f Makefile.Release

      - name: 打包(windeployqt + 后处理 + NSIS)
        shell: bash
        run: bash scripts/package_ci.sh "${{ steps.ver.outputs.version }}"

      - name: 提取 changelog 作为发布说明(仅 tag 触发)
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          import json
          d = json.load(open('packge_release/updates.json', encoding='utf-8'))
          body = d['updates']['windows']['changelog'].replace('<br/>', '\n')
          open('release_body.md', 'w', encoding='utf-8').write(body)
          PY

      - name: 建 Release + 传 asset(仅 tag 触发)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_body.md
          files: dist/EOL_CAN_Tool_Setup_v*.exe
